<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovelAI Prompt Studio 界面稿</title>
<!-- 预览用在线字体；产品里这两款开源字体随包提供 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">
<!-- 预览服务不发缓存响应头，浏览器会一直用旧的样式和脚本。这里每次打开都带上时间戳，保证刷新就是最新的 -->
<script>
  const PV_V = Date.now();
  for (const f of ['tokens.css', 'preview.css', 'preview-components.css', 'preview-settings.css', 'preview-library.css', 'preview-workbench.css'])
    document.write(`<link rel="stylesheet" href="${f}?v=${PV_V}">`);
  for (const f of ['preview-logo.js', 'preview.js', 'preview-pages.js', 'preview-settings.js', 'preview-library.js', 'preview-workbench.js'])
    document.write(`<script src="${f}?v=${PV_V}" defer><\/script>`);
</script>
</head>
<body>
<header class="pv-bar">
  <b>界面稿</b>
  <div class="pv-group"><span>页面</span><div class="seg" id="pv-page"></div></div>
  <div class="pv-group"><span>看到哪一期</span><div class="seg" id="pv-stage"></div></div>
  <div class="pv-group"><span>主题</span><div class="seg" id="pv-theme"></div></div>
</header>
<main class="pv-stage"><div class="win" id="win"></div></main>
<section class="pv-notes" id="pv-notes"></section>
</body>
</html>
