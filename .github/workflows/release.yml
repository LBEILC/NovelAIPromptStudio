name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-fonts:
    name: Prepare verified MiSans cache
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore pinned MiSans VF
        # Tags can read the default branch cache. Wait for main's prepare-fonts
        # before pushing a release tag; a feature branch cache is not visible.
        id: misans-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - name: Download MiSans on cache miss
        if: steps.misans-cache.outputs.cache-hit != 'true'
        run: npm run fonts
      - run: npm run fonts:check
      - name: Save verified MiSans for dependent jobs in this ref
        if: steps.misans-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9

  check:
    name: Release tests and types
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: prepare-fonts
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            package_args: --win --x64
            artifact: windows-x64
            artifact_glob: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: macOS Intel
            os: macos-15-intel
            package_args: --mac --x64
            artifact: macos-x64
            artifact_glob: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
          - name: macOS Apple Silicon
            os: macos-15
            package_args: --mac --arm64
            artifact: macos-arm64
            artifact_glob: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: node scripts/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Restore prepared MiSans cache (no download)
        id: misans-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - name: Fail if font cache was not prepared
        if: steps.misans-cache.outputs.cache-hit != 'true'
        run: node -e "console.error('MiSans font cache was not prepared; check the prepare-fonts job. Matrix jobs never download fonts.'); process.exit(1)"
      - run: npm run fonts:check
      - name: Package application
        if: runner.os != 'macOS'
        run: npm run package -- ${{ matrix.package_args }}

      - name: Package, sign, and notarize macOS application
        if: runner.os == 'macOS'
        run: |
          # Unset signing/notarization secrets when unconfigured: electron-builder
          # treats a defined-but-empty CSC_LINK as a relative file path and fails.
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run package -- ${{ matrix.package_args }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Launch the exact packaged application and verify native modules
        run: node scripts/verify-app.mjs --packaged --existing-package

      - run: npm run verify:fonts:package

      - name: Verify updater metadata matches packaged artifacts
        run: npm run verify:update-artifacts

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Verify combined artifacts and publish tagged releases
    needs: [check, package]
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: false

      - name: Merge updater metadata across architectures
        run: node scripts/merge-release-artifacts.mjs release-artifacts release-combined

      - name: Verify combined update metadata
        run: node scripts/verify-update-artifacts.mjs release-combined

      - name: Create checksums
        working-directory: release-combined
        run: sha256sum * > SHA256SUMS.txt

      - name: Retain verified combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-artifacts
          path: release-combined/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-combined/*
          --verify-tag
          --notes-from-tag
          --fail-on-no-commits
          --title "NovelAI Prompt Studio ${{ github.ref_name }}"
