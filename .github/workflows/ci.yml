name: CI

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-fonts:
    name: Prepare verified MiSans cache
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore pinned MiSans VF
        id: misans-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - name: Download MiSans on cache miss
        if: steps.misans-cache.outputs.cache-hit != 'true'
        run: npm run fonts
      - run: npm run fonts:check
      - name: Save verified MiSans for dependent jobs in this ref
        if: steps.misans-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9

  check:
    needs: prepare-fonts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # Includes database-native.test.js: fixed legacy fixture, atomic writes and crash recovery.
      - run: npm test
      - run: npm run build
      - run: npm run audit:ui
      - name: Restore prepared MiSans cache (no download)
        id: misans-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - name: Fail if font cache was not prepared
        if: steps.misans-cache.outputs.cache-hit != 'true'
        run: node -e "console.error('MiSans font cache was not prepared; check the prepare-fonts job. Matrix jobs never download fonts.'); process.exit(1)"
      - run: npm run fonts:check
      - run: npm run verify:app
      - name: Verify reduced motion and delayed AI settings reads
        run: npm run verify:app -- --reduced-motion
        env:
          NPS_ACCEPTANCE_SLOW_AI_READ: '1'
      - name: Upload acceptance checks and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .codex-runs/acceptance/
            .codex-runs/acceptance-reduced/
          if-no-files-found: error
      - run: npm run screenshots:app -- --constrain-window
      - name: Upload application screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screens-${{ matrix.os }}-node${{ matrix.node }}
          path: .codex-runs/screens/
          if-no-files-found: error
      - name: Verify unsigned directory package
        run: npm run verify:packaged
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload packaged acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-packaged-${{ matrix.os }}-node${{ matrix.node }}
          path: .codex-runs/acceptance-packaged/
          if-no-files-found: error
      - run: npm run verify:fonts:package
      - run: npm run screenshots:ui
      - name: Upload component screenshots and native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-004a-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .codex-runs/004a/*.png
            .codex-runs/004a/*.json
            .codex-runs/004/production-files.json
          if-no-files-found: ignore
      - name: Probe SQLite in Electron main process
        run: node scripts/probe-data-layer-electron.mjs --dev-only
      - name: Upload SQLite main process evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-probe-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .codex-runs/data-layer/electron/development.json
            .codex-runs/data-layer/electron/development.log
          if-no-files-found: ignore
