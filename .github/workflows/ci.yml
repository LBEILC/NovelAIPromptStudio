name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # Includes database-native.test.js: fixed legacy fixture, atomic writes and crash recovery.
      - run: npm test
      - run: npm run build
      - run: npm run audit:ui
      - run: npm run screenshots:ui
      - name: Upload component screenshots and native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-004a-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .codex-runs/004a/*.png
            .codex-runs/004a/*.json
            .codex-runs/004/production-files.json
          if-no-files-found: ignore
      - name: Probe SQLite in Electron main process
        run: node scripts/probe-data-layer-electron.mjs --dev-only
      - name: Upload SQLite main process evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-probe-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .codex-runs/data-layer/electron/development.json
            .codex-runs/data-layer/electron/development.log
          if-no-files-found: ignore
