name: CI

on:
  push:
    branches: [main, 'rebuild/**']
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'release-notes/**'
      - 'LICENSE'
      - 'LICENSES/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'release-notes/**'
      - 'LICENSE'
      - 'LICENSES/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # The app runs on Electron's own Node; scripts and tests target 24.
        node: [24]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Restore pinned MiSans VF
        id: misans-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - name: Download MiSans on cache miss
        if: steps.misans-cache.outputs.cache-hit != 'true'
        run: npm run fonts
      - run: npm run fonts:check
      - name: Save verified MiSans on cache miss
        if: steps.misans-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - run: npm run format:check
      - run: npm run typecheck
      # Includes database-native.test.js: fixed legacy fixture, atomic writes and crash recovery.
      - run: npm test
      - run: npm run build
      - if: matrix.node == 24
        run: npm run audit:ui
      - name: Upload check UI audit evidence
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: check-ui-audit-${{ matrix.os }}-node${{ matrix.node }}
          path: .codex-runs/004/production-files.json
          if-no-files-found: ignore

  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # The full suite in three groups side by side (electron/acceptance/run.js).
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore pinned MiSans VF
        id: misans-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - name: Download MiSans on cache miss
        if: steps.misans-cache.outputs.cache-hit != 'true'
        run: npm run fonts
      - run: npm run fonts:check
      - name: Save verified MiSans on cache miss
        if: steps.misans-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - run: npm run build
      - run: npm run verify:app -- --shard=${{ matrix.shard }}/3
      - name: Upload acceptance-checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-checks-${{ matrix.os }}-shard${{ matrix.shard }}
          path: |
            .codex-runs/acceptance-shard-${{ matrix.shard }}/
          if-no-files-found: ignore

  screenshots:
    # Only for visual review on request: Actions → CI → Run workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore pinned MiSans VF
        id: misans-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - name: Download MiSans on cache miss
        if: steps.misans-cache.outputs.cache-hit != 'true'
        run: npm run fonts
      - run: npm run fonts:check
      - name: Save verified MiSans on cache miss
        if: steps.misans-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/fonts/MiSansVF.ttf
          enableCrossOsArchive: true
          key: misans-v4.003-5daf8d5447bfd423cfdec94a0e07c53b205892223ccc6ea21b7b8a37248b44d9
      - run: npm run build
      - run: npm run screenshots:app -- --constrain-window
      - name: Upload screenshots-app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-app-${{ matrix.os }}-node24
          path: |
            .codex-runs/screens/
          if-no-files-found: ignore
